<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocUnchain</title>
  <style>
    :root {
      --bg: #0e1117;
      --surface: #161b26;
      --border: rgba(255,255,255,0.07);
      --text: #f0f4f8;
      --muted: #7a8699;
      --blue: #3b9eff;
      --blue-dim: rgba(59,158,255,0.12);
      --green: #2dd4a0;
      --green-dim: rgba(45,212,160,0.12);
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 296px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      padding: 16px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1a3a5c, #0d2137);
      border: 1px solid rgba(59,158,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg { width: 15px; height: 15px; fill: var(--blue); }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.03em;
    }

    /* ── Site status ── */
    .site-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .site-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #4a5568;
      transition: background 0.2s;
    }

    .site-dot.studocu { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
    .site-dot.scribd  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .site-dot.none    { background: #4a5568; }

    .site-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.4;
    }

    .site-label.studocu { color: var(--blue); }
    .site-label.scribd  { color: var(--green); }

    /* ── Primary button ── */
    .btn-primary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn-primary svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    .btn-primary.studocu {
      background: linear-gradient(135deg, #1d6fd4, #1557b0);
      color: #fff;
      box-shadow: 0 4px 16px rgba(29,111,212,0.4);
    }
    .btn-primary.studocu:hover { background: linear-gradient(135deg, #2478dd, #1a62c0); }
    .btn-primary.studocu:active { transform: scale(0.98); }

    .btn-primary.scribd {
      background: linear-gradient(135deg, #1aab7d, #148a64);
      color: #fff;
      box-shadow: 0 4px 16px rgba(26,171,125,0.35);
    }
    .btn-primary.scribd:hover { background: linear-gradient(135deg, #20b888, #18966e); }
    .btn-primary.scribd:active { transform: scale(0.98); }

    .btn-primary.disabled {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: default;
      box-shadow: none;
    }

    /* ── Secondary action (Studocu reset) ── */
    .btn-secondary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 500;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn-secondary svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.14);
      color: #c8d3e0;
    }

    .btn-secondary:active { transform: scale(0.98); }

    .hidden { display: none; }

    /* ── Footer ── */
    .footer {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid rgba(255,255,255,0.05);
      text-align: center;
      font-size: 10px;
      color: #3d4a5c;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </div>
      <span class="brand-name">DocUnchain</span>
    </div>
    <span class="badge">v1.0</span>
  </div>

  <div class="site-status">
    <div class="site-dot none" id="site-dot"></div>
    <span class="site-label" id="site-label">Đang kiểm tra trang...</span>
  </div>

  <!-- Studocu -->
  <button class="btn-primary studocu hidden" id="btn-studocu">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    Tải PDF Studocu
  </button>
  <button class="btn-secondary hidden" id="btn-reset">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    Reset phiên Studocu
  </button>

  <!-- Scribd -->
  <button class="btn-primary scribd hidden" id="btn-scribd">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    Tải PDF Scribd
  </button>

  <!-- Not supported -->
  <button class="btn-primary disabled hidden" id="btn-none" disabled>
    Mở trang Studocu hoặc Scribd
  </button>

  <div class="footer">Studocu &nbsp;&middot;&nbsp; Scribd &nbsp;&middot;&nbsp; PDF vector</div>

  <script src="popup.js"></script>
</body>
</html>
