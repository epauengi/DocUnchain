<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocUnchain</title>
  <style>
    :root {
      --bg: #0e1117;
      --surface: #161b26;
      --border: rgba(255,255,255,0.07);
      --text: #f0f4f8;
      --muted: #7a8699;
      --blue: #3b9eff;
      --blue-dim: rgba(59,158,255,0.12);
      --green: #2dd4a0;
      --green-dim: rgba(45,212,160,0.12);
      --red: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 296px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      padding: 16px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1a3a5c, #0d2137);
      border: 1px solid rgba(59,158,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon svg { width: 15px; height: 15px; fill: var(--blue); }

    .brand-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 20px;
      letter-spacing: 0.03em;
    }

    /* ── Site status ── */
    .site-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }

    .site-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #4a5568;
      transition: background 0.2s;
    }

    .site-dot.studocu { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
    .site-dot.scribd  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .site-dot.none    { background: #4a5568; }

    .site-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      line-height: 1.4;
    }

    .site-label.studocu { color: var(--blue); }
    .site-label.scribd  { color: var(--green); }

    /* ── Primary button ── */
    .btn-primary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.01em;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn-primary svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

    .btn-primary.studocu {
      background: linear-gradient(135deg, #1d6fd4, #1557b0);
      color: #fff;
      box-shadow: 0 4px 16px rgba(29,111,212,0.4);
    }
    .btn-primary.studocu:hover { background: linear-gradient(135deg, #2478dd, #1a62c0); }
    .btn-primary.studocu:active { transform: scale(0.98); }

    .btn-primary.scribd {
      background: linear-gradient(135deg, #1aab7d, #148a64);
      color: #fff;
      box-shadow: 0 4px 16px rgba(26,171,125,0.35);
    }
    .btn-primary.scribd:hover { background: linear-gradient(135deg, #20b888, #18966e); }
    .btn-primary.scribd:active { transform: scale(0.98); }

    .btn-primary.disabled {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: default;
      box-shadow: none;
    }

    /* ── Secondary action (Studocu reset) ── */
    .btn-secondary {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11.5px;
      font-weight: 500;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn-secondary svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.14);
      color: #c8d3e0;
    }

    .btn-secondary:active { transform: scale(0.98); }

    .hidden { display: none; }

    /* ── Feedback ── */
    .btn-feedback {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 9px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font: inherit;
      font-size: 11.5px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .btn-feedback svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; flex-shrink: 0; }
    .btn-feedback:hover { background: var(--blue-dim); border-color: rgba(59,158,255,0.35); color: var(--blue); }
    .btn-feedback:active { transform: scale(0.98); }

    .btn-feedback:focus-visible,
    .btn-primary:focus-visible,
    .btn-secondary:focus-visible,
    .feedback-dialog button:focus-visible,
    .feedback-dialog textarea:focus-visible,
    .feedback-dialog input:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    .feedback-dialog {
      width: min(264px, calc(100vw - 24px));
      max-width: none;
      margin: auto;
      padding: 16px;
      border: 1px solid rgba(59,158,255,0.28);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 18px 45px rgba(0,0,0,0.65);
    }

    .feedback-dialog::backdrop { background: rgba(5,8,14,0.72); backdrop-filter: blur(2px); }

    .feedback-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
    .feedback-description { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .feedback-form { margin-top: 14px; }
    .feedback-label { display: block; margin-bottom: 6px; color: #c8d3e0; font-size: 11.5px; font-weight: 600; }
    .feedback-textarea {
      display: block;
      width: 100%;
      min-height: 92px;
      max-height: 150px;
      resize: vertical;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(5,8,14,0.45);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      line-height: 1.45;
      user-select: text;
    }
    .feedback-textarea::placeholder { color: #586579; }
    .feedback-meta { display: flex; justify-content: flex-end; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .feedback-checkbox { display: flex; align-items: flex-start; gap: 7px; margin-top: 11px; color: var(--muted); font-size: 10.5px; line-height: 1.35; cursor: pointer; user-select: text; }
    .feedback-checkbox input { width: 13px; height: 13px; margin: 0; accent-color: var(--blue); flex-shrink: 0; }
    .feedback-actions { display: flex; gap: 8px; margin-top: 14px; }
    .feedback-actions button { flex: 1; min-height: 34px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 11.5px; font-weight: 700; }
    .feedback-cancel { border: 1px solid var(--border); background: transparent; color: var(--muted); }
    .feedback-submit { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid rgba(59,158,255,0.35); background: var(--blue); color: #06111f; }
    .feedback-submit:hover { background: #65b5ff; }
    .feedback-submit:disabled, .feedback-cancel:disabled { cursor: default; opacity: 0.6; }
    .feedback-spinner { width: 12px; height: 12px; border: 2px solid rgba(6,17,31,0.3); border-top-color: #06111f; border-radius: 50%; animation: feedback-spin 0.7s linear infinite; }
    .feedback-status { min-height: 16px; margin-top: 10px; color: var(--muted); font-size: 10.5px; line-height: 1.4; }
    .feedback-status.success { color: var(--green); }
    .feedback-status.error { color: var(--red); }
    @keyframes feedback-spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    .footer {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid rgba(255,255,255,0.05);
      text-align: center;
      font-size: 10px;
      color: #3d4a5c;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      </div>
      <span class="brand-name">DocUnchain</span>
    </div>
    <span class="badge">v1.0</span>
  </div>

  <div class="site-status">
    <div class="site-dot none" id="site-dot"></div>
    <span class="site-label" id="site-label">Đang kiểm tra trang...</span>
  </div>

  <!-- Studocu -->
  <button class="btn-primary studocu hidden" id="btn-studocu">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    Tải PDF Studocu
  </button>
  <button class="btn-secondary hidden" id="btn-reset">
    <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    Reset phiên Studocu
  </button>

  <!-- Scribd -->
  <button class="btn-primary scribd hidden" id="btn-scribd">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    Tải PDF Scribd
  </button>

  <!-- Not supported -->
  <button class="btn-primary disabled hidden" id="btn-none" disabled>
    Mở trang Studocu hoặc Scribd
  </button>

  <div class="footer">
    <button class="btn-feedback" id="btn-feedback" type="button" aria-label="Mở biểu mẫu báo lỗi">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H8l-4 2v-4.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M12 8v4M12 15.5h.01"/></svg>
      Báo lỗi
    </button>
    <div style="margin-top:8px;">Studocu &nbsp;&middot;&nbsp; Scribd &nbsp;&middot;&nbsp; PDF vector</div>
  </div>

  <dialog class="feedback-dialog" id="feedback-dialog" aria-modal="true" aria-labelledby="feedback-title" aria-describedby="feedback-description">
    <h2 class="feedback-title" id="feedback-title">Báo lỗi</h2>
    <p class="feedback-description" id="feedback-description">Hãy mô tả vấn đề bạn gặp phải để chúng tôi có thể kiểm tra và khắc phục.</p>
    <form class="feedback-form" id="feedback-form" novalidate>
      <label class="feedback-label" for="feedback-message">Nội dung báo lỗi <span aria-hidden="true">*</span></label>
      <textarea class="feedback-textarea" id="feedback-message" name="message" maxlength="2000" required placeholder="Ví dụ: Nút tải xuống không hoạt động trên trang..." aria-describedby="feedback-counter feedback-status"></textarea>
      <div class="feedback-meta" id="feedback-counter" aria-live="polite">0/2000</div>
      <label class="feedback-checkbox" for="feedback-page-url">
        <input id="feedback-page-url" type="checkbox" checked>
        <span>Đính kèm địa chỉ trang hiện tại</span>
      </label>
      <div class="feedback-status" id="feedback-status" role="status" aria-live="polite"></div>
      <div class="feedback-actions">
        <button class="feedback-cancel" id="feedback-cancel" type="button">Hủy</button>
        <button class="feedback-submit" id="feedback-submit" type="submit">Gửi báo lỗi</button>
      </div>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
